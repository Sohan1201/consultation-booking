
services:
  postgres:
    image: postgres:17-alpine
    container_name: consultation-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: consultation_user
      POSTGRES_PASSWORD: consultation_dev_password
      POSTGRES_DB: consultation_booking
    ports:
    - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultation_user -d consultation_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
